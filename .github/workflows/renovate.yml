name: Renovate

# Self-hosted rather than the GitHub App: no install to manage.
#
# This cron is the only schedule. Do not add one to renovate.json as well:
# GitHub starts scheduled runs hours late, so a run would find itself outside
# Renovate's own window and open nothing — which is what happened in
# homelab-go until the two were reduced to this one.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: renovatebot/github-action@v46.2.4
        with:
          # RENOVATE_TOKEN, when set, is a fine-grained PAT on this repository
          # with Contents, Pull requests, Issues and Workflows: Read and write.
          # GITHUB_TOKEN works without it but has two blind spots: GitHub
          # refuses it any change under .github/workflows/, so action bumps
          # cannot be pushed, and a PR it opens does not trigger CI, so every
          # other bump arrives with no checks run on it.
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: info

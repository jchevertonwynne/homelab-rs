name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux, so the jemalloc half of the crate is compiled and tested too — on a
  # Mac it is not built at all. ubuntu-latest ships a stable toolchain with
  # rustfmt and clippy, and the gcc jemalloc's build needs.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
